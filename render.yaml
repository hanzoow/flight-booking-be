# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    # Subdomain: https://<name>.onrender.com — đổi name nếu bạn muốn URL khác (trừ khi tên đã bị trùng)
    name: flight-booking-be
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LEGACY_BASE_URL
        value: https://mock-travel-api.vercel.app
